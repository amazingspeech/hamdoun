services:
  api:
    build:
      context: ..
    ports:
      - "8010:8000"
    env_file:
      - .env
    volumes:
      - ../models:/app/models
      - ../dashboard:/app/dashboard
      - ../api_keys.json:/app/api_keys.json
      - ../audit.log:/app/audit.log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
