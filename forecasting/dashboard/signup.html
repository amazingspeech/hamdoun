<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Aanmelden — Vraagvoorspelling</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap smal">
  <header class="top">
    <div class="kop">
      <p class="eyebrow">Vraagvoorspelling</p>
      <h1>Maak je account aan</h1>
      <p class="sub">7 dagen gratis proberen, daarna € 49 per maand. Geen sales-gesprek, geen installatie.</p>
    </div>
  </header>

  <form class="kaart" id="signup-form">
    <div class="veld">
      <label for="organisatie-naam">Bedrijfsnaam</label>
      <input type="text" id="organisatie-naam" required autocomplete="organization">
    </div>
    <div class="veld">
      <label for="email">E-mailadres</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="veld">
      <label for="wachtwoord">Wachtwoord</label>
      <input type="password" id="wachtwoord" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit" class="btn" id="signup-knop">Verder naar betaalgegevens</button>
    <p class="fout" id="fout" hidden></p>
  </form>

  <p class="account-nav" style="margin-top:20px;">Heb je al een account? <a href="./login.html">Log in</a></p>
</div>
<script src="./config.js"></script>
<script src="./account.js"></script>
</body>
</html>
