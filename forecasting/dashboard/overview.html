<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Overzicht — Vraagvoorspelling</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="portfolio-shell">
  <nav class="portfolio-sidebar">
    <p class="portfolio-sidebar-merk">Vraagvoorspelling</p>
    <ul class="portfolio-sidebar-nav">
      <li><a href="./overview.html" class="actief">Overzicht</a></li>
      <li><a href="./index.html">Voorspelling</a></li>
      <li><a href="./team.html">Team beheren</a></li>
    </ul>
    <div class="portfolio-sidebar-onder">
      <p class="portfolio-sidebar-status"><span class="live-stip" aria-hidden="true"></span>Bijgewerkt zojuist</p>
      <p class="portfolio-sidebar-wie" id="wie-ben-ik">Bezig met laden…</p>
      <a href="#" id="uitloggen">Uitloggen</a>
    </div>
  </nav>

  <div class="wrap portfolio-main">
    <header class="top">
      <div class="kop">
        <p class="eyebrow">Overzicht</p>
        <h1>Al je winkels in één overzicht</h1>
      </div>
      <p class="account-nav">
        <a href="./index.html">Voorspelling</a> · <a href="./team.html">Team beheren</a> ·
        <a href="#" id="uitloggen-mobiel">Uitloggen</a>
      </p>
    </header>

    <div class="cockpit-strip" id="portfolio-kpis"></div>

    <p class="leeg" id="leeg" hidden></p>

    <div class="portfolio-werkbalk">
      <div class="portfolio-zoek">
        <label for="zoeken">Zoeken</label>
        <input type="search" id="zoeken" placeholder="Winkelnaam of -nummer">
      </div>
    </div>

    <div class="portfolio-tabel-wrap">
      <table class="portfolio-tabel">
        <thead>
          <tr>
            <th>Winkel</th>
            <th class="cijfer">
              <button type="button" class="sorteerbaar" data-sorteer="totaal_p50">Verwachte omzet</button>
            </th>
            <th>Trend</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="portfolio-rijen"></tbody>
      </table>
    </div>

    <p class="fout" id="fout" hidden></p>
    <button class="btn zacht" id="meer-laden" hidden>Meer winkels laden</button>
  </div>
</div>
<script src="./config.js"></script>
<script src="./overview.js"></script>
</body>
</html>
