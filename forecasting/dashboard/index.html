<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Vraagvoorspelling — demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:oklch(98% 0.004 90); font-family:'IBM Plex Sans', -apple-system, sans-serif; color:oklch(18% 0.02 255); }
  .wrap { max-width:1000px; margin:0 auto; padding:clamp(20px,5vw,40px); }
  h1 { font:700 clamp(1.5rem,3vw,2rem)/1.3 'IBM Plex Sans'; margin:0 0 8px; }
  .sub { color:oklch(46% 0.012 140); margin:0 0 28px; }
  .controls { display:flex; gap:16px; align-items:end; flex-wrap:wrap; margin-bottom:24px; }
  label { display:block; font:600 0.8125rem/1.4 'IBM Plex Sans'; margin-bottom:6px; }
  select, input, button { font:400 0.9375rem/1.4 'IBM Plex Sans'; padding:8px 12px; border:1px solid oklch(85% 0.006 90); border-radius:6px; background:#fff; }
  button { background:oklch(70% 0.14 220); color:#001a2e; font-weight:700; border:none; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }

  #resultaat { display:none; }
  #resultaat.zichtbaar { display:block; }

  .samenvatting { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .kaart { flex:1 1 260px; border:1px solid oklch(91% 0.006 90); border-radius:12px; padding:18px 20px; background:#fff; }
  .kaart.hoofd { background:oklch(97% 0.02 220); border-color:oklch(85% 0.05 220); }
  .kaart .label { font:600 0.75rem/1.2 'IBM Plex Mono'; text-transform:uppercase; letter-spacing:0.05em; color:oklch(46% 0.012 140); margin-bottom:6px; }
  .kaart .waarde { font:700 1.625rem/1.3 'IBM Plex Sans'; color:oklch(18% 0.02 255); font-variant-numeric:tabular-nums; }
  .kaart .toelichting { font-size:0.8125rem; color:oklch(46% 0.012 140); margin-top:6px; line-height:1.5; }

  #chart-container { border:1px solid oklch(91% 0.006 90); border-radius:12px; background:#fff; padding:20px; overflow-x:auto; }
  .chart-titel { font:600 0.9375rem/1.3 'IBM Plex Sans'; margin:0 0 12px; color:oklch(30% 0.015 255); }
  .legenda { display:flex; gap:20px; flex-wrap:wrap; margin-top:10px; font-size:0.8125rem; color:oklch(40% 0.012 140); }
  .legenda span { display:inline-flex; align-items:center; gap:7px; }
  .legenda .zwatch { width:14px; height:14px; border-radius:3px; display:inline-block; }
  .legenda .zwatch.band { background:oklch(70% 0.14 220 / 0.3); border:1px solid oklch(70% 0.14 220 / 0.6); }
  .legenda .zwatch.lijn { background:oklch(48% 0.12 230); border-radius:50%; width:10px; height:10px; }
  .band { fill:oklch(70% 0.14 220 / 0.15); }
  .lijn { fill:none; stroke:oklch(48% 0.12 230); stroke-width:2; }
  .stip { fill:oklch(48% 0.12 230); }
  .as { stroke:oklch(85% 0.006 90); stroke-width:1; }
  .as-label { font:400 0.75rem 'IBM Plex Mono'; fill:oklch(50% 0.012 140); }

  details.model-info { margin-top:24px; }
  details.model-info summary { cursor:pointer; font:600 0.875rem 'IBM Plex Sans'; color:oklch(40% 0.012 140); padding:4px 0; }
  .metrics { display:flex; gap:24px; margin:14px 0 0; flex-wrap:wrap; }
  .metric { border:1px solid oklch(91% 0.006 90); border-radius:10px; padding:14px 18px; background:#fff; max-width:280px; }
  .metric .label { font:600 0.75rem/1.2 'IBM Plex Mono'; text-transform:uppercase; letter-spacing:0.05em; color:oklch(46% 0.012 140); }
  .metric .value { font:700 1.375rem/1.3 'IBM Plex Sans'; color:oklch(18% 0.02 255); }
  .metric .uitleg { font-size:0.8125rem; color:oklch(46% 0.012 140); margin-top:6px; line-height:1.5; }

  .leeg { border:1px dashed oklch(85% 0.006 90); border-radius:12px; padding:40px 20px; text-align:center; color:oklch(46% 0.012 140); }
  .fout { color:oklch(50% 0.18 25); margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Vraagvoorspelling — demo</h1>
  <p class="sub">Voorbeeld op basis van een model getraind en gevalideerd op historische retaildata.</p>

  <div class="controls">
    <div>
      <label for="store">Winkel-ID</label>
      <select id="store"></select>
    </div>
    <div>
      <label for="start">Startdatum</label>
      <input type="date" id="start">
    </div>
    <div>
      <label for="horizon">Horizon (dagen)</label>
      <input type="number" id="horizon" value="14" min="1">
    </div>
    <div>
      <button id="voorspel">Voorspel</button>
    </div>
  </div>

  <div class="leeg" id="leeg">Kies een winkel en klik op "Voorspel" om de verwachte omzet te zien.</div>

  <div id="resultaat">
    <div class="samenvatting" id="samenvatting"></div>
    <div id="chart-container">
      <p class="chart-titel" id="chart-titel"></p>
      <svg id="chart" width="920" height="360"></svg>
      <div class="legenda">
        <span><i class="zwatch lijn"></i> Verwachte omzet (meest waarschijnlijke waarde)</span>
        <span><i class="zwatch band"></i> Bandbreedte — de omzet valt hier meestal binnen</span>
      </div>
    </div>
  </div>

  <p class="fout" id="fout" hidden></p>

  <details class="model-info">
    <summary>Over dit model</summary>
    <div class="metrics" id="metrics"></div>
  </details>
</div>

<script src="./config.js"></script>
<script src="./dashboard.js"></script>
</body>
</html>
