services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./api_keys.json:/app/api_keys.json
      - ./audit.log:/app/audit.log
    restart: unless-stopped

  training:
    build: .
    profiles: ["training"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    entrypoint: ["python3", "-m", "training.cli"]
