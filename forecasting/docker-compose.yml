services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./api_keys.json:/app/api_keys.json
      - ./audit.log:/app/audit.log
      - ./tenants.db:/app/tenants.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  training:
    build: .
    profiles: ["training"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    entrypoint: ["python3", "-m", "training.cli"]
